logging:
    level:
        ROOT: DEBUG
        com.intel.bkp: DEBUG

spring:
    devtools:
        restart:
            enabled: true
        livereload:
            enabled: false
    jackson:
        serialization.indent_output: true
    datasource:
        url: jdbc:h2:file:./build/h2db/db/bkps;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
        username: bkps
        password:
        hikari:
            maximum-pool-size: 50
    h2:
        console:
            enabled: false
    jpa:
        show-sql: true
        properties:
            hibernate.id.new_generator_mappings: true
            hibernate.cache.use_second_level_cache: false
            hibernate.cache.use_query_cache: false
            hibernate.generate_statistics: true
    liquibase:
        contexts: dev
        drop-first: false
        enabled: true
    ssl:
        bundle:
            jks:
                web-server:
                    truststore:
                        location: ${KEYSTORE_TRUSTSTORE_PATH:/tmp/bkps-nonprod.p12}
                        password: donotchange
                        type: PKCS12
                    keystore:
                        location: ${KEYSTORE_TRUSTSTORE_PATH:/tmp/bkps-nonprod.p12}
                        password: donotchange
                        type: PKCS12
                    key:
                        password: donotchange
                        alias: bkps

server:
    ssl:
        bundle: "web-server"

application:
    logging:
        logstash: # Forward logs to logstash over a socket, used by LoggingConfiguration
            enabled: false
    distribution-point:
        main-path: http://localhost:8000/
        attestation-cert-base-path: content/IPCS/certs/
        zip-base-path: content/IPCS/
        trusted-root-hash: >
            8F19C3380BA92615344ADF2C583DCFCD995844CF8C837FE2AEC8BB53CB43A800,
            7A76703F2E21DE2D072B9F8C6A1745CD705114A422F765AF814B8CF31809330F
        proxy:
            host: ''
            port: 0

service:
    protocol:
        sigma: false
        spdm: true

lib-spdm-params:
    wrapper-library-path: ${LIBSPDM_WRAPPER_LIBRARY_PATH:}

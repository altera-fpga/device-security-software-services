logging:
    level:
        ROOT: TRACE
        com.intel.bkp: TRACE

service:
    data-retention:
        cron: 0 */2 * ? * *
        preserve-items: 10
        signing-key-threshold-days: 1
        sealing-key-threshold-days: 1
    protocol:
        sigma: false
        spdm: true

application:
    distribution-point:
        main-path: http://cs-service-app:8000/
        attestation-cert-base-path: content/IPCS/certs/
        zip-base-path: content/IPCS/
        trusted-root-hash: >
            8F19C3380BA92615344ADF2C583DCFCD995844CF8C837FE2AEC8BB53CB43A800,
            A11BB90D6F9F4F2E5BE018699E4F75C37016458D4910398FF5F052B7120C678E,
            8C17A32952D42FE6FD2C3BF3D2C621E3CBA6DF2401E47713FEA645435BE3CC31
        proxy:
            host: ''
            port: 0
